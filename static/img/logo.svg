<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#7a5a00"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2817"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <!-- قلم/كتاب -->
  <g transform="translate(100, 50)">
    <path d="M -15,0 L 0,-25 L 15,0 L 0,5 Z" fill="url(#goldGrad)"/>
    <path d="M -20,5 L 0,-12 L 20,5" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
  <!-- حرف الحاج -->
  <text x="100" y="130" font-family="Cairo, Arial, sans-serif" font-size="80" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">ح</text>
  <text x="100" y="180" font-family="Cairo, Arial, sans-serif" font-size="18" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">العربية</text>
</svg>
